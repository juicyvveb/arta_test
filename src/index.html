<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEST.BP Mobile</title>
    <link rel="icon" type="image/png" href="./favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Test.PB Mobile" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="A platform for creative and passionate people. Beautiful images, graphic assets, and AI-generated art.">

</head>

<body>
    <!-- hero-bg -->
    <div class="bg">
        <div class="bg__gradient bg__gradient_pink"></div>

        <div class="bg-image">
            <div class="bg__image-block bg__image-block_1">
                <img class="img1" loading="eager" fetchpriority="high" src="./images/hero-bg/moon.webp" alt="moon" />
            </div>
            <div class="bg__image-block bg__image-block_2">
                <img class="img2" loading="eager" fetchpriority="high" src="./images/hero-bg/flamingo.webp"
                    alt="flamingo" />
            </div>
            <div class="bg__image-block bg__image-block_3">
                <img class="img3" loading="eager" fetchpriority="high" src="./images/hero-bg/barbie.webp"
                    alt="barbie.webp" />
            </div>
            <div class="bg__image-block bg__image-block_4">
                <img class="img4" loading="eager" fetchpriority="high" src="./images/hero-bg/store.webp"
                    alt="store.webp" />
            </div>
            <div class="bg__image-block bg__image-block_5">
                <img class="img5" loading="eager" fetchpriority="high" src="./images/hero-bg/light.webp" alt="light" />
            </div>
            <div class="bg__image-block bg__image-block_6">
                <img class="img6" loading="eager" fetchpriority="high" src="./images/hero-bg/hagwarts.webp"
                    alt="hagwarts.webp" />
            </div>
            <div class="bg__image-block bg__image-block_7">
                <img class="img7" loading="eager" fetchpriority="high" src="./images/hero-bg/store.webp"
                    alt="store.webp" />
            </div>
            <div class="bg__image-block bg__image-block_8">
                <img class="img8" loading="eager" fetchpriority="high" src="./images/hero-bg/apocaliptic.webp"
                    alt="apocaliptic.webp" />
            </div>
            <div class="bg__image-block bg__image-block_9">
                <img class="img9" loading="eager" fetchpriority="high" src="./images/hero-bg/george.webp"
                    alt="george.webp" />
            </div>
            <div class="bg__image-block bg__image-block_10">
                <img class="img10" loading="eager" fetchpriority="high" src="./images/hero-bg/space.webp"
                    alt="space.webp" />
            </div>
            <div class="bg__image-block bg__image-block_11">
                <img class="img11" loading="eager" fetchpriority="high" src="./images/hero-bg/store.webp"
                    alt="store.webp" />
            </div>
            <div class="bg__image-block bg__image-block_12">
                <img class="img12" loading="eager" fetchpriority="high" src="./images/hero-bg/sneakers.webp"
                    alt="sneakers" />
            </div>
            <div class="bg__image-block bg__image-block_13">
                <img class="img12" loading="eager" fetchpriority="high" src="./images/hero-bg/rabbit.webp"
                    alt="rabbit.webp" />
            </div>
            <div class="bg__image-block bg__image-block_14">
                <img class="img13" loading="eager" fetchpriority="high" src="./images/hero-bg/pockemon.webp"
                    alt="pockemon.webp" />
            </div>
        </div>

        <div class="bg__gradient bg__gradient_black"></div>
    </div>

    <!-- burger -->
    <button class="burger" aria-label="Menu button">
        <div class="burger__item"></div>
    </button>

    <main class="main">
        <!-- hero  -->
        <div class="main__content">
            <h1 class="main__title" data-t-static="Get Unlimited <br>Access">
                Get Unlimited <br />Access
            </h1>

            <!-- features in hero section -->
            <div class="features">
                <!-- features-item -->
                <article class="features__item">
                    <picture>
                        <!-- prettier-ignore -->
                        <source srcset="./images/features/feature1_2x.webp 2x, ./images/features/feature1_3x.webp 3x" />
                        <!-- prettier-ignore-end -->
                        <img class="features__item-img" src="./images/features/feature1.webp"
                            alt="Unlimited Art Creation" />
                    </picture>

                    <p class="features__item-title ellipsis" data-t-static="Unlimited Art <br>Creation">
                        Unlimited Art <br />Creation
                    </p>
                    <div class="features__item-avatar features__item-avatar_hidden"></div>
                    <div class="features__item-bg features__item-bg_mask"></div>
                    <div class="features__item-bg features__item-bg_oval"></div>
                </article>

                <!-- features-item -->
                <article class="features__item">
                    <picture>
                        <!-- prettier-ignore -->
                        <source srcset="./images/features/feature2_2x.webp 2x,./images/features/feature2_3x.webp 3x" />
                        <!-- prettier-ignore-end -->
                        <img class="features__item-img" src="./images/features/feature2.webp" alt="Exclusive Styles" />
                    </picture>

                    <p class="features__item-title ellipsis" data-t-static="Exclusive <br>Styles">
                        Exclusive <br />Styles
                    </p>
                    <div class="features__item-avatar features__item-avatar_hidden"></div>
                    <div class="features__item-bg features__item-bg_mask"></div>
                </article>

                <!-- features-item -->
                <article class="features__item features__item_magic">
                    <picture>
                        <!-- prettier-ignore -->
                        <source srcset="./images/features/feature3_2x.webp 2x,./images/features/feature3_3x.webp 3x" />
                        <!-- prettier-ignore-end -->
                        <img class="features__item-img" src="./images/features/feature3.webp" alt="Exclusive Styles" />
                    </picture>
                    <p class="features__item-title ellipsis" data-t-static="Magic Avatars <br>With 20% Off">
                        Magic Avatars <br />
                        With 20% Off
                    </p>
                    <div class="features__item-avatar">
                        <svg class="features__item-avatar-ring" width="40" height="40" viewBox="0 0 42 42" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M21.1729 1.08105C32.1226 1.08105 40.9978 9.94064 40.998 20.8672C40.998 31.7939 32.1227 40.6533 21.1729 40.6533C10.2231 40.6533 1.34766 31.7939 1.34766 20.8672C1.34787 9.94067 10.2232 1.08109 21.1729 1.08105Z"
                                stroke="url(#paint0_linear_1_879)" stroke-width="0.95" />
                            <defs>
                                <linearGradient id="paint0_linear_1_879" x1="20.0904" y1="-6.26174" x2="-6.19166"
                                    y2="23.8681" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#00E8FF" />
                                    <stop offset="1" stop-color="#00CCFF" />
                                </linearGradient>
                            </defs>
                        </svg>

                        <img src="./images/features/avatar-3.webp" alt="avatar-3" />
                    </div>
                    <div class="features__item-bg features__item-bg_mask"></div>
                </article>
            </div>

            <!-- subscribtion -->
            <div class="subscribtion">
                <!-- subscribtion-action -->
                <button class="subscribtion__item subscribtion__item_best" data-value="https://apple.com/"
                    aria-label="Choose a year subscribtion">
                    <div>
                        <p class="subscribtion__item-title" data-t-static="YEARLY ACCESS">
                            YEARLY ACCESS
                        </p>
                        <p class="subscribtion__item-desc" data-t-vars="Just {{price}} per year">
                            Just {{price}} per year
                        </p>
                    </div>
                    <div>
                        <p class="subscribtion__item-desc" data-t-vars="{{price}} <br>per week">
                            {{price}} <br />per week
                        </p>
                    </div>
                    <div class="subscribtion__item-badge-wrapper">
                        <div class="subscribtion__item-badge" data-t-static="BEST OFFER">BEST OFFER</div>
                    </div>

                </button>

                <!-- subscribtion-action -->
                <button class="subscribtion__item" data-value="https://google.com/"
                    aria-label="Choose a week subscribtion">
                    <div>
                        <p class="subscribtion__item-title" data-t-static="WEEKLY ACCESS">
                            "WEEKLY ACCESS"
                        </p>
                    </div>
                    <div>
                        <p class="subscribtion__item-desc" data-t-vars="{{price}} <br>per week">
                            {{price}} <br />per week
                        </p>
                    </div>
                </button>
            </div>

            <!-- actions -->
            <div class="actions">
                <button class="actions__item" data-t-static="Continue" id="continue-subscribtion"
                    aria-label="Continue to subscribe">
                    <span class="actions__item-content">Continue</span>
                </button>
            </div>
        </div>
    </main>

    <!-- footer -->
    <footer class="footer">
        <nav class="footer__nav">
            <ul class="footer__nav-list">
                <li class="footer__nav-item">
                    <a data-t-static="Terms of Use" href="#">Terms of Use</a>
                </li>
                <li class="footer__nav-item">
                    <a data-t-static="Privacy Polic" href="#">Privacy Policy</a>
                </li>
                <li class="footer__nav-item">
                    <a data-t-static="Restore" href="#">Restore</a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
